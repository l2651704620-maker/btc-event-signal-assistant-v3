name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q BTCEventSignalAssistant_V3_ThreeTimeframe.zip -d extracted
          test -f extracted/BTCEventSignalAssistant_V4/settings.gradle.kts
          test -f extracted/BTCEventSignalAssistant_V4/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/BTCEventSignalAssistant_V4
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTCEventSignalAssistant-debug-apk
          path: extracted/BTCEventSignalAssistant_V4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

