
name: Build Android APK - BTC V5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract V5 project
        run: |
          unzip -q BTCSignalAssistantV5-Fixed.zip -d extracted
          test -f extracted/BTCSignalAssistantV5/settings.gradle.kts
          test -f extracted/BTCSignalAssistantV5/app/build.gradle.kts
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: extracted/BTCSignalAssistantV5
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTCSignalAssistant-V5-debug-apk
          path: extracted/BTCSignalAssistantV5/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
