
name: Build V8 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check and extract V8 project
        run: |
          test -f BTCSignalAssistantV8-10Min-Engine.zip
          mkdir -p extracted
          unzip -q BTCSignalAssistantV8-10Min-Engine.zip -d extracted
          test -f extracted/BTCSignalAssistantV8/settings.gradle.kts
          test -f extracted/BTCSignalAssistantV8/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/BTCSignalAssistantV8
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTCSignalAssistantV8-debug
          path: extracted/BTCSignalAssistantV8/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
