
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BTCEventSignalAssistant_V3_ThreeTimeframe.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p app-src
          unzip -q BTCEventSignalAssistant_V3_ThreeTimeframe.zip -d app-src
          echo "Project files:"
          find app-src -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find app-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD_FILE=$(find app-src -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
            if [ -z "$BUILD_FILE" ]; then
              echo "::error::No Gradle project files found in ZIP"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Event-Signal-Assistant-APK
          path: app-src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
